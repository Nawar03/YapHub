<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YapHub - Create Post</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="feed-page">
    <!-- Header -->
    <header class="feed-header">
        <div class="header-content">
            <!-- Left: Logo -->
            <div class="header-left">
                <img src="images/logo.png" alt="YapHub Logo" class="header-logo">
            </div>

            <!-- Right: User -->
            <div class="header-right">
                <div class="notification-wrapper">
                    <button class="notification-bell" id="notificationBell" onclick="toggleNotifications()" style="position:relative;">
                      <span class="notification-badge" id="notifBadge"></span>
                      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="white">
                        <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6V11c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
                      </svg>
                    </button>
                    <div class="notification-dropdown" id="notificationDropdown">
                        <p class="notification-empty">No notifications yet</p>
                    </div>
                </div>
                <div class="header-profile">
                    <a href="myprofile.html" class="profile-avatar-link">
                        <div><img id="headerAvatar" class="profile-avatar" src="images/logo2.png" alt="Avatar"></div>
                    </a>
                    <span class="header-nickname" id="headerNickname"></span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Feed Layout -->
    <div class="feed-layout">
        <!-- Left Sidebar -->
        <aside class="feed-sidebar-left">
            <div class="nav-links">
                <a href="feed.html" class="nav-link">Home</a>
                <a href="following.html" class="nav-link">Following</a>
                <a href="trending.html" class="nav-link">Trending</a>
                <a href="myprofile.html" class="nav-link">Profile</a>
                <a href="settings.html" class="nav-link">Settings</a>
            </div>
            <a href="createPost.html" class="post-btn" style="text-align:center; text-decoration:none; display:block;">Post</a>
        </aside>

        <!-- Center Content -->
        <main class="feed-main">
            <div class="post-card" style="display: flex; flex-direction: column; height: calc(100vh - 140px);">
                <div class="post-header">
                    <div class="post-header-left" style="display: flex; align-items: center;">
                        <img id="profilePic" src="images/logo2.png" style="width:30px; height:30px; border-radius:50%;">
                        <span id="postNickname" style="margin-left: 8px; font-weight: bold;"></span>
                    </div>
                    <div class="post-header-right" style="display:flex; align-items:center; gap:0.5rem;">
                        <label for="postImage" style="display:inline-flex; align-items:center; gap:0.4rem; cursor:pointer; background-color:#5F15D6; color:white; border:none; padding:6px 14px; border-radius:6px; font-size:0.85rem; font-weight:600;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                            Add photo
                        </label>
                        <input type="file" id="postImage" accept="image/*" style="display:none;" onchange="previewImage(this)">
                        <button onclick="window.location.href='feed.html'" class="post-action-btn" style="background-color: #888; color: white; border: none;">Cancel</button>
                    </div>
                </div>
                <textarea id="postContent" placeholder="What's on your mind?" maxlength="280" style="flex: 1; width: 100%; border: none; resize: none; font-size: 16px; padding: 12px; outline: none; overflow-y: auto; max-height: 120px;" oninput="updateCharCount()"></textarea>
                <div id="charCount" style="text-align: right; padding: 4px 12px; font-size: 12px; color: #999;">280 characters remaining</div>
                <div style="display: flex; flex-direction: column; margin-top: auto;">
                  <div id="postImagePreview" style="display:none; padding:0 12px 12px 12px;">
                    <div id="imagePreviewContainer" style="position:relative; width:100%; height:350px; border-radius:8px; overflow:hidden; display:flex; align-items:center; justify-content:center;">
                      <img id="previewImg" style="max-width:100%; max-height:350px; object-fit:contain; border-radius:8px; display:block;">
                      <button type="button" onclick="removeImage()" style="position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.5); border:none; color:white; cursor:pointer; font-size:0.75rem; border-radius:4px; padding:3px 8px;">Remove</button>
                    </div>
                  </div>
                  <div style="display: flex; justify-content: flex-end; padding: 8px;">
                    <button class="post-btn" id="submitPost">Post</button>
                  </div>
                </div>
            </div>
        </main>

        <!-- Right Sidebar -->
        <aside class="feed-sidebar-right">
          <div class="suggestions-box">
            <p class="suggestions-title">People you may know</p>
            <div id="suggestions-list"></div>
          </div>
        </aside>
    </div>

    <script src="js/script.js"></script>
    <script>
        if (!sessionStorage.getItem('user_id')) {
            window.location.href = 'index.html';
        }
        
        document.getElementById('headerNickname').textContent = sessionStorage.getItem('nickname') || 'Guest';
        document.getElementById('postNickname').textContent = sessionStorage.getItem('nickname') || 'Guest';

        document.getElementById('submitPost').onclick = async function() {
          const content = document.getElementById('postContent').value.trim();
          const userId = sessionStorage.getItem('user_id');
          const imageFile = document.getElementById('postImage') ? document.getElementById('postImage').files[0] : null;

          if (!content) {
            alert('Please write something before posting.');
            return;
          }

          const formData = new FormData();
          formData.append('user_id', userId);
          formData.append('content', content);
          if (imageFile) {
            formData.append('image', imageFile);
          }

          const res = await fetch('/posts', {
            method: 'POST',
            body: formData
          });

          const data = await res.json();
          if (data.success) {
            window.location.href = 'feed.html';
          } else {
            alert('Failed to post. Try again.');
          }
        };
async function loadPFP() {
  try {

    const meRes = await fetch("/me", {
      credentials: "include"
    });

    const meData = await meRes.json();

    const userId = meData.user.user_id;

    const res = await fetch(`/api/users/${userId}`);
    const data = await res.json();


    document.getElementById("profilePic").src =
        data.filepath || "images/logo2.png";

  } catch (err) {
    console.error("Profile pic error", err);
  }

}
loadPFP();

function previewImage(input) {
  const file = input.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      document.getElementById('previewImg').src = e.target.result;
      document.getElementById('postImagePreview').style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
}

function updateCharCount() {
  const textarea = document.getElementById('postContent');
  const remaining = 280 - textarea.value.length;
  const counter = document.getElementById('charCount');
  counter.textContent = remaining + ' characters remaining';
  counter.style.color = remaining < 20 ? 'red' : '#999';
}
        
function removeImage() {
  document.getElementById('postImage').value = '';
  document.getElementById('postImagePreview').style.display = 'none';
  document.getElementById('previewImg').src = '';
}
    </script>
<script>
(function() {
  const userId = sessionStorage.getItem('user_id');
  if (!userId) return;
  const list = document.getElementById('suggestions-list');
  if (!list) return;

  fetch(`/api/suggestions/${userId}`)
    .then(res => res.json())
    .then(users => {
      if (!users.length) {
        list.innerHTML = '<p style="font-size:0.85rem;color:#999;">No suggestions right now.</p>';
        return;
      }
      users.forEach(user => {
        const item = document.createElement('div');
        item.className = 'suggestion-item';
        item.innerHTML = `
  <a href="profile.html?user_id=${user.user_id}" style="color:#333;font-weight:500;font-size:0.9rem;text-decoration:none;">${user.nickname}</a>
  <button class="follow-suggestion-btn" data-user-id="${user.user_id}">Follow</button>
`;
        const btn = item.querySelector('.follow-suggestion-btn');
        btn.addEventListener('click', async () => {
          await fetch(`/api/follow/${user.user_id}`, {
            method: 'POST',
            credentials: 'include'
          });
          btn.textContent = 'Following';
          btn.classList.add('following');
          btn.disabled = true;
        });
        list.appendChild(item);
      });
    })
    .catch(() => {
      list.innerHTML = '<p style="font-size:0.85rem;color:#999;">Could not load suggestions.</p>';
    });
})();
</script>
<script>
  if (sessionStorage.getItem('user_id')) {
    checkUnreadNotifications();
  }
</script>
</body>
</html>
